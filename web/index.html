<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,9.5 16,17 3,9.5' fill='%23FB6415'/%3E%3Cpolygon points='3,9.5 16,17 16,30 3,22.5' fill='%23C2470A'/%3E%3Cpolygon points='29,9.5 16,17 16,30 29,22.5' fill='%234C66FF'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>MedRouter</title>
    <meta name="title" content="MedRouter" />
    <meta
      name="description"
      content="MedRouter — an open platform for discovering, sharing, and running AI models."
    />
    <meta name="theme-color" content="#fff" />
    <script>
      ;(function () {
        try {
          var choice = localStorage.getItem('medrouter-theme') || 'light'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {}
      })()
    </script>
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
