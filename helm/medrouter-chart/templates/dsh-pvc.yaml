{{- if and .Values.dsh.enabled .Values.dsh.persistence.enabled (not .Values.dsh.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "medrouter.dshPVCName" . }}
  labels:
    {{- include "medrouter.labels" . | nindent 4 }}
    app.kubernetes.io/component: dsh
  {{- if .Values.dsh.persistence.retain }}
  annotations:
    # Keep DSH_HOME, user workspaces, sessions and uploads when the release is
    # uninstalled. Deleting this volume destroys those files.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.dsh.persistence.accessModes | nindent 4 }}
  {{- with .Values.dsh.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dsh.persistence.size }}
{{- end }}
