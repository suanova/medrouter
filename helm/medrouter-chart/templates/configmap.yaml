{{- include "medrouter.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medrouter.fullname" . }}-config
  labels:
    {{- include "medrouter.labels" . | nindent 4 }}
data:
  APP_ENV: "production"
  SYSTEM_NAME: {{ .Values.config.SYSTEM_NAME | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  BASE_PATH: {{ include "medrouter.basePath" . | quote }}
  API_PREFIX: {{ include "medrouter.apiPrefix" . | quote }}
  PUBLIC_ORIGIN: {{ include "medrouter.publicOrigin" . | quote }}
  REGISTER_ENABLED: {{ .Values.config.REGISTER_ENABLED | quote }}
  EMAIL_VERIFICATION_ENABLED: {{ .Values.config.EMAIL_VERIFICATION_ENABLED | quote }}
  EMAIL_DEBUG_MODE: {{ .Values.config.EMAIL_DEBUG_MODE | quote }}
  ALLOW_EMAIL_DEBUG_IN_PRODUCTION: {{ .Values.config.ALLOW_EMAIL_DEBUG_IN_PRODUCTION | quote }}
  SESSION_COOKIE_SECURE: {{ include "medrouter.sessionCookieSecure" . | quote }}
  SESSION_TTL_DAYS: {{ .Values.config.SESSION_TTL_DAYS | quote }}
  SESSION_TOUCH_INTERVAL_SECONDS: {{ .Values.config.SESSION_TOUCH_INTERVAL_SECONDS | quote }}
  TRUSTED_PROXIES: {{ .Values.config.TRUSTED_PROXIES | quote }}
  SMTP_HOST: {{ .Values.config.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.config.SMTP_PORT | quote }}
  SMTP_TLS_MODE: {{ .Values.config.SMTP_TLS_MODE | quote }}
  SMTP_FROM: {{ .Values.config.SMTP_FROM | quote }}
  SMTP_USERNAME: {{ .Values.config.SMTP_USERNAME | quote }}
  GITHUB_CLIENT_ID: {{ .Values.config.GITHUB_CLIENT_ID | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.config.GOOGLE_CLIENT_ID | quote }}
  OIDC_ISSUER_URL: {{ .Values.config.OIDC_ISSUER_URL | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.OIDC_CLIENT_ID | quote }}
  OIDC_DISPLAY_NAME: {{ .Values.config.OIDC_DISPLAY_NAME | quote }}
  OIDC_SCOPES: {{ .Values.config.OIDC_SCOPES | quote }}
  INITIAL_ADMIN_USERNAME: {{ .Values.config.INITIAL_ADMIN_USERNAME | quote }}
  INITIAL_ADMIN_EMAIL: {{ .Values.config.INITIAL_ADMIN_EMAIL | quote }}
  MODEL_LIBRARY_ENABLED: {{ .Values.modelLibrary.enabled | quote }}
  MODEL_LIBRARY_CACHE_TTL_SECONDS: {{ .Values.modelLibrary.cacheTTLSeconds | quote }}
  MODEL_LIBRARY_REQUEST_TIMEOUT_SECONDS: {{ .Values.modelLibrary.requestTimeoutSeconds | quote }}
  MODEL_LIBRARY_OVERVIEW_NAMESPACE: {{ .Values.modelLibrary.overviewNamespace | quote }}
  DATASET_LIBRARY_ENABLED: {{ .Values.datasetLibrary.enabled | quote }}
  DATASET_LIBRARY_CACHE_TTL_SECONDS: {{ .Values.datasetLibrary.cacheTTLSeconds | quote }}
  DATASET_LIBRARY_REQUEST_TIMEOUT_SECONDS: {{ .Values.datasetLibrary.requestTimeoutSeconds | quote }}
  S3_ENABLED: {{ .Values.datasetFiles.enabled | quote }}
  S3_ENDPOINT: {{ .Values.datasetFiles.endpoint | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.datasetFiles.publicEndpoint | quote }}
  S3_REGION: {{ .Values.datasetFiles.region | quote }}
  S3_PATH_STYLE: {{ .Values.datasetFiles.pathStyle | quote }}
  S3_CREDENTIALS_FILE: {{ .Values.datasetFiles.credentialsFile | quote }}
  S3_CREDENTIALS_PROFILE: {{ .Values.datasetFiles.credentialsProfile | quote }}
  S3_PRESIGN_TTL_SECONDS: {{ .Values.datasetFiles.presignTTLSeconds | quote }}
  S3_LIST_CACHE_TTL_SECONDS: {{ .Values.datasetFiles.listCacheTTLSeconds | quote }}
  S3_HEAD_CACHE_TTL_SECONDS: {{ .Values.datasetFiles.headCacheTTLSeconds | quote }}
  S3_REQUEST_TIMEOUT_SECONDS: {{ .Values.datasetFiles.requestTimeoutSeconds | quote }}
  S3_STREAM_TIMEOUT_SECONDS: {{ .Values.datasetFiles.streamTimeoutSeconds | quote }}
  S3_DOWNLOAD_MODE: {{ .Values.datasetFiles.downloadMode | quote }}
  S3_PREVIEW_ENABLED: {{ .Values.datasetFiles.preview.enabled | quote }}
  S3_PREVIEW_TEXT_WINDOW_BYTES: {{ .Values.datasetFiles.preview.textWindowBytes | int64 | quote }}
  S3_PREVIEW_IMAGE_MAX_BYTES: {{ .Values.datasetFiles.preview.imageMaxBytes | int64 | quote }}
  S3_PREVIEW_PDF_MAX_BYTES: {{ .Values.datasetFiles.preview.pdfMaxBytes | int64 | quote }}
  S3_PREVIEW_CONCURRENCY: {{ .Values.datasetFiles.preview.concurrency | quote }}
  S3_DOWNLOAD_MAX_BYTES: {{ .Values.datasetFiles.download.maxBytes | int64 | quote }}
  S3_DOWNLOAD_DAILY_QUOTA_BYTES: {{ .Values.datasetFiles.download.dailyQuotaBytes | int64 | quote }}
  S3_DOWNLOAD_LARGE_THRESHOLD_BYTES: {{ .Values.datasetFiles.download.largeThresholdBytes | int64 | quote }}
  S3_DOWNLOAD_LARGE_TTL_SECONDS: {{ .Values.datasetFiles.download.largeTTLSeconds | quote }}
  STUDIO_ENABLED: {{ .Values.studio.enabled | quote }}
  STUDIO_DRY_RUN: {{ .Values.studio.dryRun | quote }}
  STUDIO_NAMESPACE: {{ .Values.studio.namespace | quote }}
  STUDIO_NOTEBOOK_IMAGE: {{ .Values.studio.notebookImage | quote }}
  STUDIO_DATASET_PVC_PATTERN: {{ .Values.studio.datasetPVCPattern | quote }}
  STUDIO_MAX_WORKSPACES: {{ .Values.studio.maxWorkspaces | quote }}
  STUDIO_RECONCILE_INTERVAL_SECONDS: {{ .Values.studio.reconcileIntervalSeconds | quote }}
  STUDIO_REQUEST_TIMEOUT_SECONDS: {{ .Values.studio.requestTimeoutSeconds | quote }}
  STUDIO_FINETUNE_IMAGE: {{ .Values.studio.finetuneImage | quote }}
  STUDIO_FINETUNE_OUTPUT_PATH: {{ .Values.studio.finetuneOutputPath | quote }}
  STUDIO_FINETUNE_DEADLINE_SECONDS: {{ .Values.studio.finetuneDeadlineSeconds | quote }}
  STUDIO_FINETUNE_MAX_SAMPLES: {{ .Values.studio.finetuneMaxSamples | quote }}
  STUDIO_AI_GATEWAY_ROUTER: {{ .Values.studio.gatewayRouter | quote }}
  {{- if eq (toString (default "postgres" .Values.database.mode)) "sqlite" }}
  SQLITE_PATH: "/data/medrouter.db"
  {{- end }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
