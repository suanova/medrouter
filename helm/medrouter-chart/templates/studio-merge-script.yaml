{{- if .Values.studio.enabled }}
{{- /*
  The merge step runs after training to fold the LoRA adapter into the base
  weights, so an existing serving profile can deploy the result. Shipping the
  script as a ConfigMap keeps recipe changes out of the training image.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.studio.mergeScriptConfigMap }}
  namespace: {{ .Values.studio.namespace }}
  labels:
    {{- include "medrouter.labels" . | nindent 4 }}
data:
  merge_lora.py: |-
{{ .Files.Get "files/merge_lora.py" | indent 4 }}
{{- end }}
