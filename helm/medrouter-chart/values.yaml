# Default values for medrouter-chart.
#
# MedRouter is a single Go binary with the React frontend embedded. The chart
# runs one container and needs no Redis. Choose a database:
#   postgres : HA PostgreSQL managed by CloudNativePG (default) -- the chart
#              vendors the operator and renders a Cluster CR with streaming
#              replication and automatic failover
#   external : an existing PostgreSQL reachable through SQL_DSN
#   sqlite   : a PersistentVolume mounted at /data (single replica only)
#
# See README.md for install examples, OAuth callbacks and upgrade notes.

nameOverride: ""
fullnameOverride: ""

image:
  # Build and push the image from this repository, or point this at your own
  # registry. An empty tag follows .Chart.AppVersion.
  # Images are built and pushed here by .github/workflows/build-image-push.yaml.
  repository: harbor.isuanova.com/suanova/medrouter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ---------------------------------------------------------------------------
# Service account and the model library
#
# The model library lists CubeStack ModelVersion and InferenceRuntimeProfile
# custom resources through the Kubernetes API. That needs a mounted service
# account token and read-only RBAC. Both are created by default; set
# modelLibrary.enabled=false to turn the feature off (the UI then shows a
# DISABLED state) or modelLibrary.rbac.create=false to manage RBAC yourself.
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  # Empty uses the release fullname.
  name: ""
  annotations: {}

modelLibrary:
  enabled: true
  rbac:
    # Creates a cluster-scoped read-only ClusterRole and ClusterRoleBinding.
    # CubeStack CRDs are cluster-scoped, so a namespaced Role is not enough.
    create: true
    # Creates a namespaced Role + RoleBinding (in overviewNamespace) granting
    # get/list on ConfigMaps, so the model library can read overview content.
    # The overview ConfigMaps there are labelled medrouter.io/overview=true.
    overview:
      create: true
  # Namespace where model overview ConfigMaps are applied. Must match where the
  # overview ConfigMaps (data.overview.yaml, label medrouter.io/overview=true)
  # are installed, and what the running ConfigMap/Deployment passes to
  # MODEL_LIBRARY_OVERVIEW_NAMESPACE.
  overviewNamespace: cubestack-system
  cacheTTLSeconds: 30
  requestTimeoutSeconds: 5

# ---------------------------------------------------------------------------
# Dataset library
#
# Lists CubeStack Dataset custom resources. It is independent of the model
# library: its own switch, its own read-only ClusterRole and its own cache, so
# a missing datasets CRD never affects /api/models (and vice versa).
# ---------------------------------------------------------------------------
datasetLibrary:
  enabled: true
  rbac:
    # Cluster-scoped read-only ClusterRole and ClusterRoleBinding, like the
    # model library. Set to false when you already grant list access yourself.
    create: true
  cacheTTLSeconds: 30
  requestTimeoutSeconds: 5

# ---------------------------------------------------------------------------
# Dataset and model files (S3)
#
# The dataset and model "Files" tabs list object keys, preview one file and
# download it. Each Dataset or ModelVersion CR declares its own
# s3://bucket/prefix, so this block only carries the endpoint and a read-only
# credential. Browsing is public; preview and download require a signed-in
# user. Bytes leave the cluster directly in presign mode and pass through
# MedRouter in proxy mode.
# ---------------------------------------------------------------------------
datasetFiles:
  enabled: false
  # S3-compatible endpoint including the scheme, e.g. http://10.66.2.1:30880
  # (Ceph RGW) or https://s3.example.com. Leave empty on real AWS to use the
  # standard endpoint for the region.
  endpoint: ""
  # Optional public or CDN hostname used only to sign download URLs. Set this
  # when endpoint is an internal address (for example US3's internal.s3-*)
  # that the browser cannot reach.
  publicEndpoint: ""
  region: us-east-1
  # Ceph RGW and most self-hosted stores need path-style addressing. Set to
  # false on real AWS (virtual-hosted style).
  pathStyle: true
  credentials:
    # Existing Secret in the release namespace. The keys below are read from
    # it and injected as env vars. Leave empty for a public bucket or when
    # credentialsFile is mounted through extraVolumes instead.
    existingSecret: ""
    accessKeyKey: S3_ACCESS_KEY_ID
    secretKeyKey: S3_SECRET_ACCESS_KEY
    sessionTokenKey: S3_SESSION_TOKEN
  # Optional path to an AWS shared credentials file (INI). Mount it with
  # extraVolumes/extraVolumeMounts and point this at the mounted file.
  credentialsFile: ""
  credentialsProfile: default
  # Signed download URL lifetime. Keep it short; the browser follows the URL
  # directly to the object store.
  presignTTLSeconds: 600
  # Directory listing cache and per-request object-store timeout.
  listCacheTTLSeconds: 20
  headCacheTTLSeconds: 30
  requestTimeoutSeconds: 5
  # Write deadline for a streaming preview or proxied download.
  streamTimeoutSeconds: 300
  # presign: the browser fetches the signed URL from the object store.
  # proxy:   bytes stream through MedRouter (use when the store is private or
  #          its token is restricted to the cluster's egress IPs).
  downloadMode: presign
  preview:
    enabled: true
    # Text previews read at most this many bytes from the head of a file; the
    # cost is the same for a 2 KB config and a 10 GB JSONL.
    textWindowBytes: 262144
    imageMaxBytes: 10485760
    pdfMaxBytes: 33554432
    concurrency: 16
  download:
    # Per-file and per-user 24h limits. 0 disables a limit.
    maxBytes: 53687091200
    dailyQuotaBytes: 107374182400
    # Files above the threshold get a longer presign TTL so an interrupted
    # transfer can be resumed.
    largeThresholdBytes: 2147483648
    largeTTLSeconds: 3600

# ---------------------------------------------------------------------------
# Studio
#
# One-click workbenches launched from a user's starred models and datasets.
# The backend matches the runtime, size and dataset volume on its own; the
# user only picks which entry to start.
#
# Start with dryRun: true. It computes and shows the matched resources without
# creating a DevEnvironment, so the sizing rules can be reviewed before the
# chart grants write access. Then set rbac.create and flip dryRun to false.
# ---------------------------------------------------------------------------
studio:
  enabled: false
  dryRun: true
  # Dedicated namespace for workspaces. It must exist already; pair it with a
  # ResourceQuota so one user cannot exhaust the cluster.
  namespace: medrouter-workspace
  notebookImage: harbor.isuanova.com/suanova/jupyter-minimal:latest
  # Public base for notebook links. The operator publishes the node address it
  # listens on; the studio keeps the path and swaps in this scheme+host. Empty
  # keeps the operator's address (fine when the API is reached directly).
  notebookBaseUrl: ""
  # Let notebooks reach the network (package installs, dataset downloads). The
  # platform restricts outbound access by default, and an install that cannot
  # reach its index fails later as a missing import.
  notebookEgress: true
  # PVC naming convention produced by the dataset caching layer.
  datasetPVCPattern: "%s-data"
  # Per-user soft limit on active workspaces.
  maxWorkspaces: 3
  reconcileIntervalSeconds: 3
  requestTimeoutSeconds: 10
  # Fine-tuning: a batch Job from a fixed recipe. Pin the image by digest so a
  # run always uses the stack it was validated against.
  finetuneImage: harbor.isuanova.com/clyang/medrouter-lora@sha256:88ebff1ee999637a2da0efaf893de03418d8fe7fca0e40f134c35198d6fa2f78
  finetuneDeadlineSeconds: 43200
  # One MXC550 runs ~2 samples/s; 20k rows x 2 epochs is about 5.5h.
  finetuneMaxSamples: 20000
  # AI gateway router the deployed InferenceService publishes through.
  gatewayRouter: cubestack-ai-gateway-private
  # Role + RoleBinding that allow managing DevEnvironments in `namespace`.
  # Only rendered when enabled and not dry-run.
  rbac:
    create: true

# Keep at 1 with SQLite: a SQLite file cannot be shared between pods. The
# chart rejects replicaCount > 1 in SQLite mode. PostgreSQL modes can scale.
replicaCount: 1

# ---------------------------------------------------------------------------
# Database
#
#   postgres : HA PostgreSQL managed by CloudNativePG (default). The chart
#              vendors the CloudNativePG operator subchart and renders a
#              Cluster CR: one primary plus streaming replicas, automatic
#              failover and self-signed TLS. Set
#              database.postgres.operator.install=false when CloudNativePG is
#              already installed in the cluster.
#   external : an existing PostgreSQL server reachable through SQL_DSN.
#   sqlite   : a database file on a PersistentVolume (single replica only).
# ---------------------------------------------------------------------------
database:
  mode: postgres # postgres | external | sqlite

  postgres:
    # Install the vendored CloudNativePG operator subchart. Disable it when
    # the cluster already runs CloudNativePG; the Cluster CR is still
    # rendered and the operator reconciles it.
    operator:
      install: true

    # PostgreSQL instance image for the managed Cluster. The tag encodes the
    # major version; keep it compatible with the operator version (1.30.0).
    # The same image is used for the wait-for-postgres init container.
    image: ghcr.io/cloudnative-pg/postgresql:16.14-system-trixie
    # >= 2 for HA. 3 is recommended: after a failover the new primary still
    # has a streaming replica attached.
    instances: 3
    storage: 10Gi
    # Empty uses the cluster default StorageClass.
    storageClassName: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    auth:
      # Database and owner role created by bootstrap.initdb.
      database: medrouter
      # PostgreSQL identifier (no hyphens): [a-z_][a-z0-9_]* only.
      username: medrouter
    # Block pod startup until the primary accepts connections.
    waitForPostgres: true
    # Add helm.sh/resource-policy: keep to the Cluster so `helm uninstall`
    # leaves the database (and its PVCs) intact. Delete the Cluster manually
    # to destroy data.
    retain: true
    # Scheduled backups. method: volumeSnapshot needs the VolumeSnapshot CRDs
    # and a VolumeSnapshotClass; fileArchiving needs barmanObjectStore.
    backups:
      enabled: false
      schedule: "0 0 2 * * 0"
      method: volumeSnapshot
      # barmanObjectStore:
      #   endpointURL: https://s3.example.com
      #   destinationPath: s3://bucket/cnpg-backups/
      #   s3Credentials:
      #     accessKeyId:
      #       name: cnpg-backup-s3-creds
      #       key: ACCESS_KEY_ID
      #     secretAccessKey:
      #       name: cnpg-backup-s3-creds
      #       key: ACCESS_SECRET_KEY
    # Optional PgBouncer pooler in front of the primary. MedRouter keeps
    # connecting to the -rw service directly; enable the pooler only if other
    # clients need it.
    pgBouncer:
      enabled: false
      replicas: 2

  external:
    # Full libpq DSN, e.g.
    # postgres://user:pass@db.example.com:5432/medrouter?sslmode=require
    # Stored in the chart-created Secret, never in the ConfigMap.
    # Ignored when secret.create=false: put SQL_DSN in secret.existingSecret.
    dsn: ""
    # Block pod startup until the DSN accepts connections (psql "SELECT 1").
    waitForPostgres: true
    waitImage: postgres:17-alpine

# Used only with database.mode=sqlite. The volume is mounted at /data and the
# database lives at /data/medrouter.db.
persistence:
  enabled: true
  # Keep the PVC when the release is uninstalled. Set false for throwaway
  # environments; retained data must be deleted manually.
  retain: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  # Use a pre-created PVC instead of rendering one. It must be writable by the
  # container user and mounted at /data.
  existingClaim: ""

# ---------------------------------------------------------------------------
# Application environment (ConfigMap, injected via envFrom)
#
# APP_ENV is always production in this chart. Secrets (session/OAuth/SMTP/
# admin password) live under `secrets` below, never here.
# ---------------------------------------------------------------------------
config:
  PORT: "3000"
  # URL path prefix, e.g. "/medrouter". The Ingress and the HTTPRoute publish
  # this exact prefix; no rewrite is applied. Empty means the site root.
  BASE_PATH: ""
  # Prefix the API lives under; the app mounts the API at API_PREFIX + "/api",
  # so the default exposes it at /medrouter/api. "/" puts it at /api. When
  # BASE_PATH is set, API_PREFIX must stay under it so the published route
  # reaches the API.
  API_PREFIX: "/medrouter"
  # Browser-visible origin. Empty means: https://<first ingress host> when the
  # Ingress is enabled, https://<first gateway hostname> when
  # gateway.hostnames is set, otherwise http://localhost:<PORT>. It MUST match
  # the address users type in the browser: login POSTs are origin-checked and
  # OAuth callbacks redirect here.
  PUBLIC_ORIGIN: ""
  SYSTEM_NAME: MedRouter

  REGISTER_ENABLED: "true"
  # Registration email verification is off by default so a fresh install needs
  # no SMTP. Turn it on together with SMTP_HOST/SMTP_USERNAME and
  # secrets.SMTP_PASSWORD.
  EMAIL_VERIFICATION_ENABLED: "false"
  EMAIL_DEBUG_MODE: "false"
  ALLOW_EMAIL_DEBUG_IN_PRODUCTION: "false"

  # Empty means auto: true for an https PUBLIC_ORIGIN, false for http (so
  # port-forward over http still works). Set explicitly to override.
  SESSION_COOKIE_SECURE: ""
  SESSION_TTL_DAYS: "30"
  SESSION_TOUCH_INTERVAL_SECONDS: "3600"

  # Comma-separated proxy CIDRs. Behind ingress-nginx, set this to the pod/
  # node CIDR so per-IP rate limits see the real client address.
  TRUSTED_PROXIES: ""

  SMTP_HOST: ""
  SMTP_PORT: "465"
  SMTP_TLS_MODE: implicit # implicit | starttls | none
  SMTP_FROM: "MedRouter <no-reply@medrouter.local>"
  SMTP_USERNAME: ""

  # OAuth providers appear on the sign-in page only when their client ID and
  # secret are both set. Callback URL:
  #   ${PUBLIC_ORIGIN}${BASE_PATH}/api/oauth/<provider>/callback
  GITHUB_CLIENT_ID: ""
  GOOGLE_CLIENT_ID: ""
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_DISPLAY_NAME: SSO
  OIDC_SCOPES: openid email profile

  # Optional one-time bootstrap of a root account. The password is in
  # secrets.INITIAL_ADMIN_PASSWORD. Leave empty to skip.
  INITIAL_ADMIN_USERNAME: ""
  INITIAL_ADMIN_EMAIL: ""

  # Additional plain environment variables (name: value). Do not put secrets
  # here and do not duplicate the keys managed above.
  extra: {}

# ---------------------------------------------------------------------------
# Secret
# create=true  : the chart creates the Secret; empty secrets.* values are
#                generated (SESSION_SECRET) or left empty.
# create=false : use a pre-created Secret. It must contain SESSION_SECRET and,
#                with database.mode=external, SQL_DSN. Other keys are optional.
#                In managed PostgreSQL mode the chart still creates its own
#                app-auth and DSN Secrets.
# ---------------------------------------------------------------------------
secret:
  create: true
  existingSecret: ""

secrets:
  # Generated with 48 random characters when empty and secret.create=true.
  # Keep it stable across upgrades; rotating it signs everyone out.
  SESSION_SECRET: ""
  # Owner password for the managed PostgreSQL cluster (database.mode=postgres).
  # Generated with 24 random characters when empty and reused across upgrades
  # via lookup on the "<cluster>-app-auth" secret. Must not contain URI special
  # characters (@ : / ? # [ ] %) or spaces, because it is embedded in SQL_DSN.
  POSTGRES_PASSWORD: ""
  SMTP_PASSWORD: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_SECRET: ""
  OIDC_CLIENT_SECRET: ""
  INITIAL_ADMIN_PASSWORD: ""

# ---------------------------------------------------------------------------
# Service / Ingress
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  # Hostnames only, without scheme. With BASE_PATH set, the Ingress routes that
  # prefix and the app serves it as-is.
  hosts: []
  tls:
    # Set true together with secretName (or a cert-manager annotation that
    # populates it). TLS is also what makes PUBLIC_ORIGIN default to https and
    # the session cookie Secure.
    enabled: false
    secretName: ""

# ---------------------------------------------------------------------------
# Gateway (HTTPRoute) - the CubeStack ingress equivalent.
#
# Exposes MedRouter under config.BASE_PATH through the shared platform Gateway
# (the envoy-gateway component of cubestack-operator). Prefer this over
# `ingress` when the cluster runs Envoy Gateway + Gateway API (the CubeStack
# platform default).
# ---------------------------------------------------------------------------
gateway:
  enabled: true
  parent:
    # The platform Gateway the HTTPRoute attaches to, and its namespace. In a
    # CubeStack install this is cubestack-gateway in envoy-gateway-system
    # (the envoy-gateway component); the reference is cross-namespace, so both
    # must be explicit.
    name: cubestack-gateway
    namespace: envoy-gateway-system
  # Hostnames this HTTPRoute answers for. Empty means every hostname the parent
  # Gateway serves: an HTTPRoute without hostnames matches all of the Gateway's
  # listeners, not just the one pointing at MedRouter. On a shared platform
  # Gateway, set the host MedRouter is published under (e.g.
  # medrouter.example.com) so the route — and the root redirect below — cannot
  # answer for the platform console or another app on the same Gateway.
  hostnames: []
  # Send a bare visit to the Gateway root ("/") to the app, so
  # https://<host>/ lands on https://<host>/medrouter/ instead of 404ing.
  # Only rendered when config.BASE_PATH is set: with an empty BASE_PATH the app
  # already serves "/" and no redirect is needed.
  #
  # A redirect is not a rewrite: the browser address bar changes to the target,
  # so /medrouter stays visible. Use it only when "/" is meant to point at
  # MedRouter (see README for when the prefix cannot be hidden).
  rootRedirect:
    enabled: true
    # 302 keeps the redirect out of browser caches while paths are changing.
    statusCode: 302

# Only rendered when replicaCount > 1: minAvailable=1 would block eviction of a
# single-replica deployment.
pdb:
  enabled: true
  minAvailable: 1

# Soft anti-affinity for multi-replica PostgreSQL deployments.
podAntiAffinity: true

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Left empty by default so any image user can be used. A read-only root
# filesystem works if /data is writable; provide securityContext overrides for
# your image.
securityContext: {}
# The bundled image runs as UID/GID 10001, and fsGroup lets that user write to
# a freshly provisioned SQLite PVC. Override this if your storage or image uses
# a different group.
podSecurityContext:
  fsGroup: 10001

nodeSelector: {}
tolerations: []

# Extra env entries: [{name: X, value: "1"}]
envVars: []
extraVolumes: []
extraVolumeMounts: []

command: []
args: []

# ---------------------------------------------------------------------------
# CloudNativePG operator (vendored subchart, installed when
# database.postgres.operator.install=true). These values are passed to
# charts/cloudnative-pg; see that chart's values.yaml for the full list.
# ---------------------------------------------------------------------------
cloudnative-pg:
  image:
    repository: ghcr.io/cloudnative-pg/cloudnative-pg
    tag: "1.30.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

